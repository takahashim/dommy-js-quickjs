name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.gemfile != 'Gemfile' && ' (released quickjs)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        gemfile: [Gemfile]
        include:
          # The Gemfile pins a quickjs fork; this runs what a RubyGems install
          # gets, where Backend.premature_rejection_reports? is true. A gemfile
          # unlike the matrix's makes this a job of its own rather than
          # changing the 4.0 one.
          - ruby: "4.0"
            gemfile: gemfiles/quickjs-released.gemfile
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake
